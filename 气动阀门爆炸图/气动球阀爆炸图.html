<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>气动球阀爆炸图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D stage; drawing title block + part card on the left, BOM on the right, control strip along the bottom */
:root{
  --bg:#e5e9ee; --bg2:#f6f8fa; --panel:rgba(248,250,252,.92); --panel-solid:#f8fafc;
  --fg:#17202b; --muted:#566271; --line:#c3cbd5; --accent:#1c4db5; --accent-ink:#ffffff;
  --hl:#d98e0b; --hl-ink:#1b1204; --good:#1b7f47; --bad:#bf3b27; --shadow-a:.22;
  --f-cn:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ctrl-h:120px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10141a; --bg2:#1b222c; --panel:rgba(21,26,34,.92); --panel-solid:#161c25;
  --fg:#e2e7ee; --muted:#98a3b1; --line:#2f3945; --accent:#86a4ff; --accent-ink:#0c1222;
  --hl:#f2b13d; --hl-ink:#1b1204; --good:#4fc386; --bad:#ff7d66; --shadow-a:.55; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10141a; --bg2:#1b222c; --panel:rgba(21,26,34,.92); --panel-solid:#161c25;
  --fg:#e2e7ee; --muted:#98a3b1; --line:#2f3945; --accent:#86a4ff; --accent-ink:#0c1222;
  --hl:#f2b13d; --hl-ink:#1b1204; --good:#4fc386; --bad:#ff7d66; --shadow-a:.55; color-scheme:dark }

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-cn);-webkit-font-smoothing:antialiased}
#app{position:relative;height:100%;overflow:hidden;background:radial-gradient(120% 90% at 50% 38%,var(--bg2),var(--bg) 72%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#leaders,#balloons{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .2s}
#leaders line{stroke:var(--fg);stroke-width:.9;opacity:.55}
#leaders circle{fill:var(--fg);opacity:.7}
#leaders line.sel{stroke:var(--hl);opacity:1;stroke-width:1.4}
#leaders circle.sel{fill:var(--hl);opacity:1}
.bln{position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  border:1.25px solid var(--fg);background:var(--panel-solid);color:var(--fg);
  font:600 12.5px/1 var(--f-num);display:grid;place-items:center;padding:0;pointer-events:auto;cursor:pointer;
  font-variant-numeric:tabular-nums;will-change:transform}
.bln:hover{border-color:var(--accent);color:var(--accent)}
.bln.sel{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.bln:focus-visible,.btn:focus-visible,.row:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.hud{position:absolute;z-index:2}
.left{top:12px;left:max(16px,env(safe-area-inset-left,0px));width:min(320px,calc(100% - 32px));display:flex;flex-direction:column;gap:10px}

.tb{border:1.25px solid var(--fg);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:grid;grid-template-columns:1fr auto;font-size:12px}
.tb>div{padding:6px 9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.tb>div:nth-child(2n){border-right:0}
.tb>div:nth-last-child(-n+2){border-bottom:0}
.tb .name{grid-column:1/-1;border-right:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tb h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.04em;text-wrap:balance}
.tb .en{font:600 12px/1 var(--f-num);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.tb .k{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em}
.tb .v{font:500 12px/1.35 var(--f-mono)}

.card{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:6px;padding:12px 12px 12px 12px;display:flex;flex-direction:column;gap:8px}
.card-head{display:flex;gap:10px;align-items:flex-start}
.card-no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--hl);color:var(--hl-ink);display:grid;place-items:center;font:600 15px/1 var(--f-num)}
.card h2{margin:0;font-size:16px;font-weight:700;line-height:1.25}
.card .jp{font-size:12px;color:var(--muted);margin-top:2px}
.card .x{margin-left:auto;flex:none;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px;border-radius:4px}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.card dt{color:var(--muted)}
.card dd{margin:0;font-family:var(--f-mono);font-size:12px;min-width:0}
.card p{margin:0;font-size:13px;line-height:1.6;max-width:60ch}
.hint{font-size:12px;color:var(--muted);line-height:1.5}

.bom{top:12px;right:max(16px,env(safe-area-inset-right,0px));width:380px;bottom:calc(var(--ctrl-h) + 10px);
  border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:6px;display:flex;flex-direction:column;min-height:0}
.bom-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.bom-head h3{margin:0;font-size:14px;font-weight:700}
.bom-head h3 small{font:500 12px var(--f-mono);color:var(--muted);margin-left:6px}
.bom-list{overflow:auto;flex:1;min-height:0}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:2px 10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0;color:var(--fg);font:inherit}
.row:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.row.sel{background:color-mix(in srgb,var(--hl) 18%,transparent)}
.row .n{grid-column:1;grid-row:1/3;width:22px;height:22px;border-radius:50%;border:1.25px solid var(--fg);display:grid;place-items:center;font:600 12px/1 var(--f-num)}
.row.sel .n{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.row .nm{grid-column:2;grid-row:1;font-size:13px;font-weight:500;min-width:0}
.row .nm span{color:var(--muted);font-weight:400;font-size:11.5px;margin-left:6px}
.row .q{grid-column:3;grid-row:1/3;font:500 12px var(--f-mono);color:var(--muted)}
.row .m{grid-column:2;grid-row:2;font:400 11px/1.3 var(--f-mono);color:var(--muted);min-width:0}

.ctrl{left:0;right:0;bottom:0;padding-block:8px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{max-width:1040px;margin:0 auto;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.bar-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:500 13px/1 var(--f-cn);padding:8px 11px;border:1px solid var(--line);background:var(--panel-solid);color:var(--fg);border-radius:6px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn svg{width:14px;height:14px;fill:currentColor}
.slider{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:180px}
.slider label{font-size:12px;color:var(--muted);white-space:nowrap}
.slider input{flex:1;min-width:0;accent-color:var(--accent)}
.slider output{font:500 12px var(--f-mono);width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.chip{font:600 12px/1 var(--f-cn);padding:5px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.chip.open{color:var(--good)} .chip.closed{color:var(--bad)} .chip.moving{color:var(--hl)}
.cap{font-size:12.5px;line-height:1.55;color:var(--muted);min-width:0}
.cap b{color:var(--fg);font-weight:500}
.spacer{flex:1 1 0}

@media (max-width:760px){
  .left{width:calc(100% - 32px)}
  .tb .hidemob{display:none}
  .tb{grid-template-columns:1fr 1fr}
  #info{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--ctrl-h) + 8px + env(safe-area-inset-bottom,0px));width:auto;max-height:42%;overflow:auto}
  .bom{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;top:auto;max-height:52%;bottom:calc(var(--ctrl-h) + 8px)}
  .btn .lbl-long{display:none}
  .slider{flex-basis:100%}
}
@media (prefers-reduced-motion: reduce){ #leaders,#balloons{transition:none} }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="气动球阀三维爆炸图，可拖动旋转"></canvas>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="balloons"></div>

  <div class="hud left">
    <div class="tb" role="group" aria-label="图纸标题栏">
      <div class="name"><h1>气动球阀</h1><span class="en">Pneumatic ball valve · exploded</span></div>
      <div><span class="k">规格</span><span class="v">DN25 · PN63 · 三片式</span></div>
      <div><span class="k">执行器</span><span class="v">单作用 · 弹簧复位</span></div>
      <div class="hidemob"><span class="k">连接法兰</span><span class="v">ISO 5211 F05</span></div>
      <div class="hidemob"><span class="k">图号 / 单位</span><span class="v">PBV-25-EX · mm</span></div>
    </div>
    <div id="info" class="card" hidden aria-live="polite">
      <div class="card-head">
        <div class="card-no" id="i-no">1</div>
        <div><h2 id="i-cn">阀体</h2><div class="jp" id="i-jp">ボデー</div></div>
        <button class="x" id="i-close" aria-label="关闭说明">×</button>
      </div>
      <dl><dt>材料</dt><dd id="i-mat">—</dd><dt>数量</dt><dd id="i-qty">—</dd></dl>
      <p id="i-desc"></p>
    </div>
    <div class="hint" id="hint">拖动旋转，滚轮或双指缩放。点零件或编号看说明。</div>
  </div>

  <section class="hud bom" id="bom" hidden aria-label="零件表">
    <div class="bom-head"><h3>零件表<small id="bom-count"></small></h3><button class="btn" id="bom-close">收起</button></div>
    <div class="bom-list" id="bom-list"></div>
  </section>

  <div class="hud ctrl" id="ctrl">
    <div class="bar">
      <div class="bar-row">
        <button class="btn primary" id="b-play"><svg viewBox="0 0 16 16"><path d="M3 2l11 6-11 6z"/></svg><span id="b-play-t">装配</span></button>
        <div class="slider"><label for="r-ex">爆炸</label><input id="r-ex" type="range" min="0" max="100" value="100"><output id="o-ex">100%</output></div>
        <button class="btn" id="b-act"><span id="b-act-t">关阀</span><span class="lbl-long">动作演示</span></button>
        <span class="chip open" id="chip">全开</span>
        <span class="spacer"></span>
        <button class="btn" id="b-lbl" aria-pressed="true">编号</button>
        <button class="btn" id="b-bom" aria-pressed="false">零件表</button>
        <button class="btn" id="b-view" aria-label="复位视角">复位</button>
      </div>
      <div class="cap" id="cap"><b>当前全开。</b>球体通孔与管道同轴；中间腔有压缩空气，两只活塞被推到外侧，6 根弹簧处于压缩状态。</div>
    </div>
  </div>
</div>
