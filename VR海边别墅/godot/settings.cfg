; 画质设置（改完重新运行即可）
; 如果 VR 里卡顿，依次关掉: gi="off" → ssr=false → ssao=false

[graphics]

; 全局光照（光在屋里反弹）: "voxel" = VoxelGI（默认，启动时烘焙几秒）/ "sdfgi" = SDFGI / "off" = 关
gi="voxel"
; 环境光遮蔽（墙角、家具底下变暗）
ssao=true
; 屏幕空间反射（亮面地砖、泳池映出东西）
ssr=true
; VR 里的屏幕空间特效（双眼渲染时容易右眼出白影，默认关；左手柄 ☰ 键可以在 VR 里临时逐个开关排查）
xr_ssr=false
xr_ssao=false
; VR 里的全局光照: "sdfgi"（默认）/ "voxel" / "off"
; 实测 VoxelGI 在 VR 右眼出白影（关 MSAA 也没用），SDFGI 双眼正常。VR 卡顿就改 "off"
xr_gi="sdfgi"
; SDFGI 最小格子（米）: 越小屋里越细腻、越耗显卡；卡就改 0.3；想更细可试 0.15
sdfgi_cell=0.2
; SDFGI 反弹光强度: 屋里偏暗就调大（比如 1.5）
sdfgi_energy=1.0
; 没有全局光照时环境光的补偿倍数（屋里太暗就调大，比如 1.6）
no_gi_ambient=1.4
