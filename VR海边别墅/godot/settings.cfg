; 画质设置（改完重新运行即可）
; 如果 VR 里卡顿，依次关掉: gi="off" → ssr=false → ssao=false

[graphics]

; 全局光照（光在屋里反弹）: "voxel" = VoxelGI（默认，启动时烘焙几秒）/ "sdfgi" = SDFGI / "off" = 关
gi="voxel"
; 环境光遮蔽（墙角、家具底下变暗）
ssao=true
; 屏幕空间反射（亮面地砖、泳池映出东西）
ssr=true
; VR 里的屏幕空间特效（双眼渲染时容易右眼出白影，默认关；左手柄 ☰ 键可以在 VR 里临时逐个开关排查）
xr_ssr=false
xr_ssao=false
