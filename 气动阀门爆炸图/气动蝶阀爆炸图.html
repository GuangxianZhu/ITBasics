<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>气动蝶阀爆炸图</title>
<style>/* 姘斿姩铦堕榾 路 exploded view 鈥?drawing-sheet UI */
:root{
  --bg:#e7eaee; --bg2:#f7f9fb; --panel:rgba(249,251,252,.92); --solid:#f9fbfc;
  --fg:#141c25; --muted:#57626f; --line:#c2cad3; --hair:#9aa5b1;
  --accent:#0e6f66; --accent-ink:#fff;
  --hl:#c9761a; --hl-ink:#fff;
  --shadow-a:.22;
  --f-cn:"Microsoft YaHei UI","PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;
  --f-num:"Bahnschrift","DIN Alternate","Arial Narrow",sans-serif;
  --f-mono:"Cascadia Mono","Consolas","SFMono-Regular",monospace;
  --ctrl-h:112px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1318; --bg2:#1a2029; --panel:rgba(20,25,32,.92); --solid:#151a21;
  --fg:#e3e8ee; --muted:#96a1ae; --line:#2d3742; --hair:#46525e;
  --accent:#5fd0c1; --accent-ink:#08211f; --hl:#f0ab4b; --hl-ink:#1d1204; --shadow-a:.5; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1318; --bg2:#1a2029; --panel:rgba(20,25,32,.92); --solid:#151a21;
  --fg:#e3e8ee; --muted:#96a1ae; --line:#2d3742; --hair:#46525e;
  --accent:#5fd0c1; --accent-ink:#08211f; --hl:#f0ab4b; --hl-ink:#1d1204; --shadow-a:.5; color-scheme:dark }

html{height:100%;box-sizing:border-box}
[hidden]{display:none!important}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--f-cn);
  -webkit-font-smoothing:antialiased;font-size:14px}
#app{position:relative;height:100%;overflow:hidden;
  background:radial-gradient(115% 85% at 48% 40%,var(--bg2) 0%,var(--bg) 74%)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#leaders,#balloons{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#leaders line{stroke:var(--fg);stroke-width:.9;opacity:.5}
#leaders circle{fill:var(--fg);opacity:.65}
#leaders line.sel{stroke:var(--hl);opacity:1;stroke-width:1.5}
#leaders circle.sel{fill:var(--hl);opacity:1}
#app.no-lbl #leaders,#app.no-lbl #balloons{display:none}

.bln{position:absolute;left:0;top:0;width:23px;height:23px;margin:-11.5px 0 0 -11.5px;border-radius:50%;
  border:1.2px solid var(--fg);background:var(--solid);color:var(--fg);padding:0;cursor:pointer;
  font:600 12.5px/1 var(--f-num);font-variant-numeric:tabular-nums;display:grid;place-items:center;
  pointer-events:auto;will-change:transform;transition:background .16s,color .16s,border-color .16s}
.bln:hover{border-color:var(--accent);color:var(--accent)}
.bln.sel{background:var(--hl);border-color:var(--hl);color:var(--hl-ink);transform-origin:center}

.hud{position:absolute;z-index:3}
.left{top:14px;left:max(16px,env(safe-area-inset-left,0px));width:min(330px,calc(100% - 32px));
  display:flex;flex-direction:column;gap:10px;pointer-events:none}
.left>*{pointer-events:auto}

/* drawing title block */
.tb{border:1.4px solid var(--fg);background:var(--panel);backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);display:grid;grid-template-columns:1fr 1fr}
.tb>div{padding:6px 9px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.tb>div:nth-child(2n){border-right:0}
.tb>div:nth-last-child(-n+2){border-bottom:0}
.tb .name{grid-column:1/-1;border-right:0;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding-bottom:7px}
.tb h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.06em}
.tb .en{font:600 10.5px/1.2 var(--f-num);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tb .k{display:block;font-size:10px;color:var(--muted);letter-spacing:.1em;margin-bottom:2px}
.tb .v{font:500 11.5px/1.35 var(--f-mono)}

/* part card */
.card{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);border-radius:5px;padding:11px 12px;display:flex;flex-direction:column;gap:8px}
.card-head{display:flex;gap:10px;align-items:flex-start}
.card-no{flex:none;width:27px;height:27px;border-radius:50%;background:var(--hl);color:var(--hl-ink);
  display:grid;place-items:center;font:600 14.5px/1 var(--f-num)}
.card h2{margin:0;font-size:15.5px;font-weight:700;line-height:1.25}
.card .jp{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.card .en2{font:600 9.5px/1 var(--f-num);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.card .x{margin-left:auto;flex:none;border:0;background:transparent;color:var(--muted);font-size:18px;
  line-height:1;cursor:pointer;padding:2px 5px;border-radius:4px}
.card .x:hover{color:var(--fg)}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:11.5px}
.card dt{color:var(--muted)}
.card dd{margin:0;font-family:var(--f-mono);font-size:11.5px;min-width:0}
.card p{margin:0;font-size:12.5px;line-height:1.62;color:var(--fg)}
.hint{font-size:11.5px;color:var(--muted);line-height:1.55}

/* BOM */
.bom{top:14px;right:max(16px,env(safe-area-inset-right,0px));width:392px;bottom:calc(var(--ctrl-h) + 10px);
  border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);border-radius:5px;display:flex;flex-direction:column;min-height:0}
.bom-head{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line)}
.bom-head h3{margin:0;font-size:13.5px;font-weight:700;letter-spacing:.04em}
.bom-head h3 small{font:500 11px var(--f-mono);color:var(--muted);margin-left:7px;letter-spacing:0}
.bom-list{overflow:auto;flex:1;min-height:0;padding:2px 0 6px}
.row{display:grid;grid-template-columns:26px 1fr 34px;gap:2px 8px;width:100%;text-align:left;border:0;
  background:transparent;color:inherit;padding:5px 12px;cursor:pointer;font-family:inherit;align-items:baseline}
.row:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.row.sel{background:color-mix(in srgb,var(--hl) 20%,transparent)}
.row .n{font:600 12px var(--f-num);color:var(--muted);font-variant-numeric:tabular-nums}
.row.sel .n{color:var(--hl)}
.row .nm{font-size:12.5px;display:flex;align-items:baseline;gap:7px;min-width:0}
.row .nm b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.row .q{font:500 11.5px var(--f-mono);color:var(--muted);text-align:right}
.row .m{grid-column:2/4;font:500 10.5px var(--f-mono);color:var(--muted);opacity:.9}

/* control strip */
.ctrl{bottom:0;left:0;right:0;padding:0 max(16px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px)}
.bar{border-top:1px solid var(--line);background:var(--panel);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);padding:10px max(14px,0px) 9px;display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.btn{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--fg);background:transparent;
  border:1px solid var(--line);border-radius:4px;padding:6px 11px;cursor:pointer;display:inline-flex;
  align-items:center;gap:6px;white-space:nowrap;transition:border-color .15s,color .15s,background .15s}
.btn:hover{border-color:var(--hair)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);padding-left:9px}
.btn.primary:hover{filter:brightness(1.08)}
.btn svg{width:13px;height:13px;fill:currentColor}
.btn:focus-visible,.row:focus-visible,.bln:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.slider{display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.slider input[type=range]{width:150px;accent-color:var(--accent);cursor:pointer}
.slider output{font:500 11.5px var(--f-mono);color:var(--fg);min-width:38px}
.chip{font:600 11px var(--f-num);letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:3px;
  border:1px solid currentColor;color:var(--muted)}
.chip.open{color:var(--accent)}
.chip.closed{color:var(--hl)}
.chip.moving{color:var(--muted);opacity:.85}
.spacer{flex:1}
.cap{font-size:12px;line-height:1.55;color:var(--muted);max-width:96ch}
.cap b{color:var(--fg);font-weight:600}

@media (max-width:1080px){ .bom{width:320px} .slider input[type=range]{width:110px} }
@media (max-width:760px){
  :root{--ctrl-h:146px}
  .tb h1{font-size:17px}
  .bom{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;
    top:auto;bottom:calc(var(--ctrl-h) + 8px);height:34vh}
  .left{width:calc(100% - 24px);left:max(12px,env(safe-area-inset-left,0px))}
  .left .hint{display:none}
  .bar{padding:8px 10px}
  .bar-row{gap:7px}
  .slider{order:3;width:100%}
  .slider input[type=range]{flex:1;width:auto}
  .cap{display:none}
  .btn{padding:5px 9px;font-size:12px}
}
@media (prefers-reduced-motion: reduce){ .bln,.btn{transition:none} }</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="气动蝶阀三维爆炸图，可拖动旋转"></canvas>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="balloons"></div>

  <div class="hud left">
    <div class="tb" role="group" aria-label="图纸标题栏">
      <div class="name"><h1>气动蝶阀</h1><span class="en">Pneumatic butterfly valve · exploded</span></div>
      <div><span class="k">规格</span><span class="v">DN80 · PN16 · 对夹式</span></div>
      <div><span class="k">执行器</span><span class="v">齿轮齿条 · 单作用</span></div>
      <div class="hide-sm"><span class="k">安装法兰</span><span class="v">ISO 5211 F05</span></div>
      <div class="hide-sm"><span class="k">图号 / 单位</span><span class="v">DBV-80-EX · mm</span></div>
    </div>

    <div id="info" class="card" hidden aria-live="polite">
      <div class="card-head">
        <div class="card-no" id="i-no">1</div>
        <div style="min-width:0"><h2 id="i-cn">阀体</h2><div class="jp" id="i-jp">ボデー</div><div class="en2" id="i-en">BODY</div></div>
        <button class="x" id="i-close" aria-label="关闭说明">×</button>
      </div>
      <dl><dt>材料</dt><dd id="i-mat">—</dd><dt>数量</dt><dd id="i-qty">—</dd></dl>
      <p id="i-desc"></p>
    </div>

    <div class="hint" id="hint">拖动旋转，滚轮或双指缩放。点零件或编号看说明。</div>
  </div>

  <section class="hud bom" id="bom" hidden aria-label="零件表">
    <div class="bom-head"><h3>零件表<small id="bom-count"></small></h3><button class="btn" id="bom-close">收起</button></div>
    <div class="bom-list" id="bom-list"></div>
  </section>

  <div class="hud ctrl" id="ctrl">
    <div class="bar">
      <div class="bar-row">
        <button class="btn primary" id="b-play"><svg viewBox="0 0 16 16"><path d="M3 2l11 6-11 6z"/></svg><span id="b-play-t">装配</span></button>
        <div class="slider"><label for="r-ex">爆炸</label><input id="r-ex" type="range" min="0" max="100" value="100"><output id="o-ex">100%</output></div>
        <button class="btn" id="b-act"><span id="b-act-t">开阀</span><span class="lbl-long">动作演示</span></button>
        <span class="chip closed" id="chip">全关</span>
        <span class="spacer"></span>
        <button class="btn" id="b-lbl" aria-pressed="true">编号</button>
        <button class="btn" id="b-bom" aria-pressed="false">零件表</button>
        <button class="btn" id="b-view">复位视角</button>
      </div>
      <div class="cap" id="cap"></div>
    </div>
  </div>
</div>

<script>(() => {
'use strict';
try {
/* ============================================================================
   0 · 场景 / 相机 / 灯光 / 材质 / 几何工具
   坐标约定：X = 介质流向，Y = 阀杆与齿轮轴方向，Z = 气缸与活塞行程方向。单位 mm。
   ========================================================================== */
const T = window.THREE;
const V2 = T.Vector2;
const V3 = T.Vector3;

const canvas = document.getElementById("c");
const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = T.SRGBColorSpace;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);

const scene = new T.Scene();
const pmrem = new T.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new T.RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 1.02;

const camera = new T.PerspectiveCamera(30, 1, 2, 9000);
camera.position.set(520, 380, 620);

const controls = new T.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.085;
controls.minDistance = 120;
controls.maxDistance = 6000;
controls.maxPolarAngle = Math.PI * 0.96;

/* 主光：工程图式的干净侧上方光 + 冷色轮廓光 */
const key = new T.DirectionalLight(0xffffff, 2.5);
key.position.set(300, 520, 340);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -460, right: 460, top: 460, bottom: -460, near: 10, far: 2000 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.6;
scene.add(key, key.target);

const rim = new T.DirectionalLight(0xdfe9ff, 1.0);
rim.position.set(-360, 200, -400);
scene.add(rim);

const fill = new T.HemisphereLight(0xffffff, 0x8b949c, 0.45);
scene.add(fill);

/* 地面：只接收阴影，不画实体 */
const ground = new T.Mesh(new T.PlaneGeometry(7000, 7000), new T.ShadowMaterial({ opacity: 0.22 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------------------------------------------------------- 材质库 */
const PRESET = {
  body: { color: 0x64717d, metalness: 0.45, roughness: 0.5 }, // 球铁环氧涂层
  bodyDark: { color: 0x505b66, metalness: 0.45, roughness: 0.55 },
  iron: { color: 0x7d858d, metalness: 0.9, roughness: 0.44 },
  ss: { color: 0xc7ccd1, metalness: 1, roughness: 0.3 },
  mirror: { color: 0xeef1f3, metalness: 1, roughness: 0.07 },
  epdm: { color: 0x2a2e33, metalness: 0, roughness: 0.74 },
  ptfe: { color: 0xf2efe6, metalness: 0, roughness: 0.6, sheen: 0.35, sheenColor: 0xffffff },
  nbr: { color: 0x1c1f22, metalness: 0, roughness: 0.82 },
  alu: { color: 0xb9bfc5, metalness: 0.9, roughness: 0.4 },
  aluDark: { color: 0x8d949b, metalness: 0.85, roughness: 0.5 },
  blue: { color: 0x2f4f7d, metalness: 0.25, roughness: 0.4, clearcoat: 0.5, clearcoatRoughness: 0.28 },
  zinc: { color: 0xb2b8bf, metalness: 1, roughness: 0.27 },
  black: { color: 0x24282c, metalness: 0.5, roughness: 0.42 },
  nickel: { color: 0xd2d7dc, metalness: 1, roughness: 0.19 },
  spring: { color: 0x8d9297, metalness: 0.85, roughness: 0.34 },
  brass: { color: 0xc7a12c, metalness: 1, roughness: 0.45 },
  coil: { color: 0x1b1e22, metalness: 0, roughness: 0.38, clearcoat: 0.6, clearcoatRoughness: 0.24 },
  red: { color: 0xbb3b2c, metalness: 0, roughness: 0.4, clearcoat: 0.4 },
  yellow: { color: 0xe0ae2e, metalness: 0, roughness: 0.34, clearcoat: 0.6 },
  hole: { color: 0x080a0c, metalness: 0, roughness: 0.95 },
  sealBlue: { color: 0x2b6ea8, metalness: 0, roughness: 0.42 },
};
const mat = (k) => {
  if (!PRESET[k]) throw new Error("unknown material: " + k);
  return new T.MeshPhysicalMaterial({ ...PRESET[k], side: T.DoubleSide });
};
/* 选中/悬停时加自发光，每个网格独立材质，避免互相串色 */
const hlColor = new T.Color(0xc9761a);

/* ---------------------------------------------------------------- 几何工具 */
/* 折线轮廓 → 带圆角的内外点列。点格式 [r, y, 圆角半径?]（圆角半径可逐点覆盖） */
function outline(pts, radius = 0.6, closed = true) {
  const n = pts.length;
  const out = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    const rr = p.length > 2 ? p[2] : radius;
    const end = !closed && (i === 0 || i === n - 1);
    if (end || rr <= 0) {
      out.push(new V2(p[0], p[1]));
      continue;
    }
    const a = pts[(i - 1 + n) % n];
    const b = pts[(i + 1) % n];
    const ax = a[0] - p[0], ay = a[1] - p[1];
    const bx = b[0] - p[0], by = b[1] - p[1];
    const la = Math.hypot(ax, ay) || 1, lb = Math.hypot(bx, by) || 1;
    const m = Math.min(rr, la * 0.45, lb * 0.45);
    out.push(new V2(p[0] + (ax / la) * m, p[1] + (ay / la) * m));
    out.push(new V2(p[0] + (bx / lb) * m, p[1] + (by / lb) * m));
  }
  if (closed) out.push(out[0].clone());
  return out;
}

/* 回转体：轮廓点 [r, y] 绕 Y 轴回转；折边法线让端面与倒角保持锐利 */
function lathe(pts, opts = {}) {
  const { segments = 96, radius = 0.6, closed = true } = opts;
  return T.toCreasedNormals(new T.LatheGeometry(outline(pts, radius, closed), segments), 0.5);
}
/* 绕 X 轴的回转体（管道方向：法兰、阀座、蝶板） */
const latheX = (g) => g.rotateZ(-Math.PI / 2);
/* 绕 Z 轴的回转体（活塞、端盖中心体） */
const latheZ = (g) => g.rotateX(Math.PI / 2);

/* 拉伸：默认沿 +Z，深度含倒角；折边法线让平面保持锐利 */
function extrude(shape, depth, bevel = 0.6, curveSegments = 32) {
  const g = new T.ExtrudeGeometry(shape, {
    depth: Math.max(depth - 2 * bevel, 0.01),
    bevelEnabled: bevel > 0,
    bevelThickness: bevel,
    bevelSize: bevel,
    bevelOffset: -bevel,
    bevelSegments: 1,
    curveSegments,
    steps: 1,
  });
  g.translate(0, 0, bevel);
  return T.toCreasedNormals(g, 0.55);
}
const extrudeX = (shape, depth, x, bevel = 0.6, cs = 32) =>
  extrude(shape, depth, bevel, cs).rotateY(Math.PI / 2).translate(x, 0, 0);
const extrudeY = (shape, depth, y, bevel = 0.6, cs = 32) =>
  extrude(shape, depth, bevel, cs).rotateX(-Math.PI / 2).translate(0, y, 0);
const extrudeZ = (shape, depth, z, bevel = 0.6, cs = 32) => extrude(shape, depth, bevel, cs).translate(0, 0, z);

/* 2D 图形 */
function circlePath(x, y, r) {
  const p = new T.Path();
  p.absarc(x, y, r, 0, Math.PI * 2, true);
  return p;
}
function ringShape(rOuter, rInner, cx = 0, cy = 0) {
  const s = new T.Shape();
  s.absarc(cx, cy, rOuter, 0, Math.PI * 2, false);
  s.holes.push(circlePath(cx, cy, rInner));
  return s;
}
function roundRectShape(hx, hy, r, cx = 0, cy = 0) {
  const s = new T.Shape();
  const x0 = cx - hx, x1 = cx + hx, y0 = cy - hy, y1 = cy + hy;
  s.moveTo(x0 + r, y0);
  s.lineTo(x1 - r, y0);
  s.absarc(x1 - r, y0 + r, r, -Math.PI / 2, 0, false);
  s.lineTo(x1, y1 - r);
  s.absarc(x1 - r, y1 - r, r, 0, Math.PI / 2, false);
  s.lineTo(x0 + r, y1);
  s.absarc(x0 + r, y1 - r, r, Math.PI / 2, Math.PI, false);
  s.lineTo(x0, y0 + r);
  s.absarc(x0 + r, y0 + r, r, Math.PI, Math.PI * 1.5, false);
  return s;
}
function hexShape(acrossFlats, holeR = 0, rot = 0) {
  const R = acrossFlats / Math.sqrt(3);
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = rot + (i * Math.PI) / 3;
    pts.push(new V2(R * Math.cos(a), R * Math.sin(a)));
  }
  const s = new T.Shape(pts);
  if (holeR > 0) s.holes.push(circlePath(0, 0, holeR));
  return s;
}
/* 齿轮轮廓：齿数、齿根半径、齿顶半径 */
function gearShape(teeth, rRoot, rTip, holeR = 0) {
  const pts = [];
  for (let i = 0; i < teeth; i++) {
    const a = (i / teeth) * Math.PI * 2;
    const step = (Math.PI * 2) / teeth;
    pts.push(new V2(rTip * Math.cos(a), rTip * Math.sin(a)));
    pts.push(new V2(rRoot * Math.cos(a + step * 0.5), rRoot * Math.sin(a + step * 0.5)));
  }
  const s = new T.Shape(pts);
  if (holeR > 0) s.holes.push(circlePath(0, 0, holeR));
  return s;
}

/* 螺旋线（弹簧）：沿 +Z 生长 */
class Helix extends T.Curve {
  constructor(radius, turns, length) {
    super();
    this.radius = radius;
    this.turns = turns;
    this.length = length;
  }
  getPoint(t, target = new V3()) {
    const a = t * this.turns * Math.PI * 2;
    return target.set(this.radius * Math.cos(a), this.radius * Math.sin(a), t * this.length);
  }
}
const helixGeo = (r, turns, len, wire = 1.4) =>
  new T.TubeGeometry(new Helix(r, turns, len), Math.ceil(turns * 24), wire, 7, false);

/* 一个小工具：把若干 [geometry, material] 打进一个 Group */
function group(...items) {
  const g = new T.Group();
  for (const [geo, m] of items) g.add(new T.Mesh(geo, mat(m)));
  return g;
}
/* Z 向镜像（对称零件：左右活塞、两端盖） */
function mirrorZ(g) {
  const out = new T.Group();
  g.rotation.y = Math.PI;
  out.add(g);
  return out;
}

/* ============================================================================
   1 · 零件建模（全部按图纸尺寸手写：DN80 对夹式蝶阀 + 齿轮齿条单作用执行器）
   ========================================================================== */
const assembly = new T.Group();
scene.add(assembly);

const PARTS = [];   // 零件定义（含说明文字）
const MESHES = [];  // 参与拾取与包围盒计算的网格

function part(def) {
  const d = { insts: [], ...def };
  PARTS.push(d);
  return d;
}
/* 把一组几何注册成一个零件实例；ex = 爆炸位移 [x,y,z,延迟] */
/* 爆炸位移按轴分别缩放：横向拉开、纵向收一点，让画面更像工程爆炸图而不是一根竖条 */
const EX_X = 1.06;
const EX_Y = 0.88;
const EX_Z = 1.2;
function place(def, g, ex = [], opts = {}) {
  assembly.add(g);
  const rec = {
    g,
    part: def,
    ex: ex.map((e) => ({ v: new V3(e[0] * EX_X, e[1] * EX_Y, e[2] * EX_Z), s: e[3] == null ? 0 : e[3] })),
    base: g.position.clone(),
    baseRot: g.rotation.y,
    ...opts,
  };
  def.insts.push(rec);
  g.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      o.userData.part = def;
      MESHES.push(o);
    }
  });
  return rec;
}

/* ============================================================================
   2 · 交互层：机位自适应、爆炸/动作动画、气泡编号、零件表、拾取与说明
   ========================================================================== */
const state = {
  t: 1,            // 爆炸进度 0 装配 / 1 全爆
  tTarget: null,   // 播放按钮驱动
  stroke: 0,       // 阀门动作 0 全关 / 1 全开
  strokeTarget: 0,
  labels: window.innerWidth >= 820,
  sel: null,
  hover: null,
  moved: false,
  shadowA: 0.22,
};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* 缓动 + 依次入场：延迟 s 的零件在全爆进度后段才动，形成层次 */
const smooth = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const stagger = (t, s) => smooth(Math.min(1, Math.max(0, (t - s * 0.62) / 0.38)));

const tmpV = new V3();
function applyExplode() {
  const travel = state.stroke * STROKE;
  for (const p of PARTS) {
    for (const r of p.insts) {
      tmpV.set(0, 0, 0);
      for (const e of r.ex) tmpV.addScaledVector(e.v, stagger(state.t, e.s));
      if (r.slide) tmpV.z += r.slide * travel * 0.6;
      r.g.position.copy(r.base).add(tmpV);
      if (r.rot) r.g.rotation.y = r.baseRot + -r.rot * state.stroke * Math.PI * 0.5;
      if (r.spring) {
        const L = SPR_L0 - travel * 0.6;
        r.g.scale.z = L / SPR_L0;
      }
    }
  }
}

/* ------------------------------------------------------------- 版心与机位 */
const inset = { top: 0, bottom: 0, left: 0, right: 0 };
const elBom = document.getElementById("bom");
const elCtrl = document.getElementById("ctrl");
const elLeft = document.querySelector(".left");
const elTb = document.querySelector(".tb");
const elInfo = document.getElementById("info");

function measureInsets() {
  const app = document.getElementById("app").getBoundingClientRect();
  const ctrl = elCtrl.getBoundingClientRect();
  const tb = elTb.getBoundingClientRect();
  const narrow = app.width < 820;
  inset.bottom = Math.max(0, app.bottom - ctrl.top);
  inset.top = narrow ? Math.max(0, tb.bottom - app.top + 6) : 0;
  /* 窄屏时说明卡和零件表是盖在画布上的浮层：把被盖住的边算进内边距 */
  if (narrow && !elInfo.hidden) {
    inset.top = Math.max(inset.top, elInfo.getBoundingClientRect().bottom - app.top + 6);
  }
  if (narrow && !elBom.hidden) {
    inset.bottom = Math.max(inset.bottom, app.bottom - elBom.getBoundingClientRect().top + 6);
  }
  inset.right = !elBom.hidden && !narrow ? elBom.offsetWidth + 18 : 0;
  inset.left = !narrow && app.width >= 980 ? Math.min(app.width * 0.26, tb.right - app.left + 10) : 0;
}

const camDir = new V3(0.9, 0.86, 1.18).normalize();
let fitA = null;
let fitB = null;

/* 机位求解：把包围盒顶点投影到“安全区”（扣除标题栏/零件表/控制条后的矩形）里刚好装下。
   D ≥ (角点沿视线方向的深度) + (横向偏移换算出的距离)，一次解出，不再迭代试探。 */
function fitFor(t) {
  const prev = state.t;
  state.t = t;
  applyExplode();
  assembly.updateMatrixWorld(true);
  const w = canvas.clientWidth || 1;
  const h = canvas.clientHeight || 1;
  const pad = t > 0.5 ? (state.labels ? 34 : 18) : Math.min(48, w * 0.05);
  const safeW = Math.max(80, w - inset.left - inset.right - pad * 2);
  const safeH = Math.max(80, h - inset.top - inset.bottom - pad * 2);
  const cx = inset.left + safeW / 2 + pad;
  const cy = inset.top + safeH / 2 + pad;

  const box = new T.Box3();
  for (const m of MESHES) box.expandByObject(m);
  const C = box.getCenter(new V3());
  /* 逐网格取包围盒角点：比整体 AABB 贴合得多，斜放的爆炸图能占满画面 */
  const corners = [];
  for (const m of MESHES) {
    const g = m.geometry;
    if (!g.boundingBox) g.computeBoundingBox();
    const bb = g.boundingBox;
    for (const x of [bb.min.x, bb.max.x])
      for (const y of [bb.min.y, bb.max.y])
        for (const z of [bb.min.z, bb.max.z]) corners.push(new V3(x, y, z).applyMatrix4(m.matrixWorld));
  }

  const aspect = w / h;
  const tanHalf = Math.tan((camera.fov * Math.PI) / 360);
  const probe = new T.PerspectiveCamera(camera.fov, aspect, 1, 1e6);
  probe.position.copy(C).add(camDir);
  probe.lookAt(C);
  probe.updateMatrixWorld(true);
  const right = new V3().setFromMatrixColumn(probe.matrixWorld, 0);
  const up = new V3().setFromMatrixColumn(probe.matrixWorld, 1);

  const solve = (target) => {
    let D = 1;
    for (const c of corners) {
      const rx = c.x - target.x, ry = c.y - target.y, rz = c.z - target.z;
      const u = Math.abs(rx * right.x + ry * right.y + rz * right.z);
      const v = Math.abs(rx * up.x + ry * up.y + rz * up.z);
      const depth = rx * camDir.x + ry * camDir.y + rz * camDir.z;
      D = Math.max(D, depth + (u * w) / (safeW * tanHalf * aspect), depth + (v * h) / (safeH * tanHalf));
    }
    return D;
  };

  const target = C.clone();
  let dist = solve(target);
  for (let i = 0; i < 2; i++) {
    const wp = (2 * dist * tanHalf) / h;
    target.addScaledVector(right, (w / 2 - cx) * wp);
    target.addScaledVector(up, (cy - h / 2) * wp);
    dist = solve(target);
  }
  state.t = prev;
  applyExplode();
  return { target, dist: Math.max(dist * 1.02, 160), center: C, box };
}

function refit() {
  measureInsets();
  const o = fitA;
  fitA = fitFor(0);
  fitB = fitFor(1);
  state.t = o ? state.t : 1;
  applyExplode();
  camPlace(true);
  ground.position.y = fitA.box.min.y - 1;
  key.position.copy(fitA.box.getCenter(new V3())).add(new V3(240, 520, 300));
  key.target.position.copy(fitA.box.getCenter(new V3()));
  if (!state.moved) camera.position.copy(fitB.target).addScaledVector(camDir, fitB.dist);
}

const lerpT = new V3();
function camPlace(instant) {
  if (!fitA || !fitB) return;
  if (state.moved) return; // 用户接管视角后不抢镜头
  const k = smooth(Math.min(1, state.t / 0.82));
  lerpT.lerpVectors(fitA.target, fitB.target, k);
  const d = fitA.dist + (fitB.dist - fitA.dist) * k;
  controls.target.copy(lerpT);
  camera.position.copy(lerpT).addScaledVector(camDir, d);
  camera.near = Math.max(2, d / 60);
  camera.far = d * 8;
  camera.updateProjectionMatrix();
  if (instant) controls.update();
}

/* ------------------------------------------------------------------ 编号气泡 */
const SVG = "http://www.w3.org/2000/svg";
const elLeaders = document.getElementById("leaders");
const elBalloons = document.getElementById("balloons");
const bubble = PARTS.map((p) => {
  const b = document.createElement("button");
  b.className = "bln";
  b.type = "button";
  b.textContent = p.no;
  b.setAttribute("aria-label", `${p.no} ${p.cn}`);
  b.addEventListener("click", (e) => { e.stopPropagation(); select(p); });
  elBalloons.appendChild(b);
  const ln = document.createElementNS(SVG, "line");
  const dot = document.createElementNS(SVG, "circle");
  dot.setAttribute("r", "2");
  elLeaders.append(ln, dot);
  return { p, b, ln, dot, x: 0, y: 0, tx: 0, ty: 0, ax: 0, ay: 0, off: false, init: false };
});

const projTmp = new V3();
function project(p) {
  projTmp.copy(p).project(camera);
  return [((projTmp.x + 1) / 2) * (canvas.clientWidth || 1), ((1 - projTmp.y) / 2) * (canvas.clientHeight || 1)];
}

const boxTmp = new T.Box3();
function updateBalloons() {
  const vis = state.labels ? Math.min(1, Math.max(0, (state.t - 0.5) / 0.28)) : 0;
  elBalloons.style.opacity = vis;
  elLeaders.style.opacity = vis;
  elBalloons.style.visibility = elLeaders.style.visibility = vis > 0 ? "visible" : "hidden";
  if (vis <= 0) {
    for (const l of bubble) l.init = false;
    return;
  }
  const w = canvas.clientWidth || 1;
  const h = canvas.clientHeight || 1;
  const [cx, cy] = project(boxTmp.copy(box).getCenter(new V3()));

  for (const l of bubble) {
    const inst = l.p.insts[0];
    boxTmp.makeEmpty().expandByObject(inst.g);
    const [ax, ay] = project(boxTmp.getCenter(new V3()));
    l.ax = ax; l.ay = ay;
    l.off = ax < -40 || ax > w + 40 || ay < -40 || ay > h + 40;
    let dx = ax - cx, dy = ay - cy;
    const len = Math.hypot(dx, dy) || 1;
    dx /= len; dy /= len;
    l.tx = ax + dx * 52;
    l.ty = ay + dy * 46;
    if (!l.init) { l.x = l.tx; l.y = l.ty; }
    l.nx = l.x + (l.tx - l.x) * 0.55;
    l.ny = l.y + (l.ty - l.y) * 0.55;
  }
  const m = 16;
  const x0 = m, x1 = w - inset.right - m, y0 = inset.top + m, y1 = h - inset.bottom - m;
  for (let iter = 0; iter < 8; iter++) {
    for (let i = 0; i < bubble.length; i++) {
      for (let j = i + 1; j < bubble.length; j++) {
        const a = bubble[i], b = bubble[j];
        if (a.off || b.off) continue;
        let dx = b.nx - a.nx, dy = b.ny - a.ny;
        const d = Math.hypot(dx, dy);
        if (d < 30) {
          if (d < 0.01) { dx = 1; dy = 0; }
          const push = (30 - d) / 2 / (d || 1);
          a.nx -= dx * push; a.ny -= dy * push;
          b.nx += dx * push; b.ny += dy * push;
        }
      }
    }
    for (const l of bubble) {
      l.nx = Math.min(x1, Math.max(x0, l.nx));
      l.ny = Math.min(y1, Math.max(y0, l.ny));
    }
  }
  for (const l of bubble) {
    l.x = l.nx; l.y = l.ny; l.init = true;
    l.b.hidden = l.off;
    l.ln.style.display = l.dot.style.display = l.off ? "none" : "";
    l.b.style.transform = `translate(${l.x.toFixed(1)}px,${l.y.toFixed(1)}px)`;
    const dx = l.x - l.ax, dy = l.y - l.ay;
    const d = Math.hypot(dx, dy) || 1;
    const ex = l.x - (dx / d) * 11.5, ey = l.y - (dy / d) * 11.5;
    l.ln.setAttribute("x1", l.ax.toFixed(1)); l.ln.setAttribute("y1", l.ay.toFixed(1));
    l.ln.setAttribute("x2", ex.toFixed(1)); l.ln.setAttribute("y2", ey.toFixed(1));
    l.dot.setAttribute("cx", l.ax.toFixed(1)); l.dot.setAttribute("cy", l.ay.toFixed(1));
    const on = state.sel === l.p;
    l.b.classList.toggle("sel", on);
    l.ln.classList.toggle("sel", on);
    l.dot.classList.toggle("sel", on);
  }
}
let box = new T.Box3();

/* ------------------------------------------------------------------ 高亮 */
function paint() {
  for (const m of MESHES) {
    const p = m.userData.part;
    if (p === state.sel) { m.material.emissive.copy(hlColor); m.material.emissiveIntensity = 0.6; }
    else if (p === state.hover) { m.material.emissive.copy(hlColor); m.material.emissiveIntensity = 0.22; }
    else m.material.emissiveIntensity = 0;
  }
}

/* ------------------------------------------------------------------ 零件表 */
const elList = document.getElementById("bom-list");
document.getElementById("bom-count").textContent = `${PARTS.length} 种 · ${PARTS.reduce((n, p) => n + p.qty, 0)} 件`;
const rows = PARTS.map((p) => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "row";
  b.innerHTML = `<span class="n">${p.no}</span><span class="nm"><b>${p.cn}</b><span>${p.jp}</span></span><span class="q">×${p.qty}</span><span class="m">${p.mat}</span>`;
  b.addEventListener("click", () => select(p));
  elList.appendChild(b);
  return { p, el: b };
});

/* ------------------------------------------------------------------ 选中 */
const elHint = document.getElementById("hint");
function select(p) {
  state.sel = p;
  paint();
  for (const r of rows) r.el.classList.toggle("sel", r.p === p);
  const wasHidden = elInfo.hidden;
  if (!p) {
    elInfo.hidden = true;
    elHint.hidden = false;
    if (!wasHidden && innerWidth < 820) refit();
    return;
  }
  document.getElementById("i-no").textContent = p.no;
  document.getElementById("i-cn").textContent = p.cn;
  document.getElementById("i-jp").textContent = p.jp;
  document.getElementById("i-en").textContent = p.en;
  document.getElementById("i-mat").textContent = p.mat;
  document.getElementById("i-qty").textContent = p.qty + " 件";
  document.getElementById("i-desc").textContent = p.desc;
  elInfo.hidden = false;
  elHint.hidden = true;
  if (innerWidth < 820) { if (elBom.hidden) refit(); else toggleBom(false); }
}
document.getElementById("i-close").addEventListener("click", () => select(null));

/* ------------------------------------------------------------------ 拾取 */
const ray = new T.Raycaster();
const ndc = new V2();
function pickAt(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(MESHES, false)[0];
  return hit ? hit.object.userData.part : null;
}
let down = null;
canvas.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener("pointerup", (e) => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6) select(pickAt(e));
  down = null;
});
canvas.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse" || e.buttons) return;
  const p = pickAt(e);
  if (p !== state.hover) {
    state.hover = p;
    paint();
    canvas.style.cursor = p ? "pointer" : "";
  }
});
canvas.addEventListener("pointerleave", () => {
  if (state.hover) { state.hover = null; paint(); canvas.style.cursor = ""; }
});

/* ------------------------------------------------------------------ 控件 */
const elBomBtn = document.getElementById("b-bom");
function toggleBom(on) {
  elBom.hidden = !on;
  elBomBtn.setAttribute("aria-pressed", String(on));
  measureInsets();
  refit();
}
elBomBtn.addEventListener("click", () => toggleBom(elBom.hidden));
document.getElementById("bom-close").addEventListener("click", () => toggleBom(false));

const elRange = document.getElementById("r-ex");
const elOut = document.getElementById("o-ex");
const elPlayT = document.getElementById("b-play-t");
function syncSlider() {
  const v = Math.round(state.t * 100);
  elRange.value = v;
  elOut.textContent = v + "%";
  elPlayT.textContent = state.t > 0.5 ? "装配" : "爆炸";
}
elRange.addEventListener("input", () => {
  state.tTarget = null;
  state.t = elRange.value / 100;
  syncSlider();
});
document.getElementById("b-play").addEventListener("click", () => {
  const to = state.t > 0.5 ? 0 : 1;
  if (reduce) { state.t = to; syncSlider(); applyExplode(); camPlace(true); return; }
  state.tTarget = to;
});
document.getElementById("b-lbl").addEventListener("click", (e) => {
  state.labels = !state.labels;
  e.currentTarget.setAttribute("aria-pressed", String(state.labels));
  document.getElementById("app").classList.toggle("no-lbl", !state.labels);
  measureInsets();
  refit();
});
document.getElementById("b-view").addEventListener("click", () => {
  state.moved = false;
  refit();
});

/* 阀门动作 */
const elChip = document.getElementById("chip");
const elCap = document.getElementById("cap");
const elActT = document.getElementById("b-act-t");
const CAP = {
  closed: "<b>当前全关。</b>弹簧把两只活塞推向中间，齿条带动齿轮轴把蝶板转成与流向垂直，橡胶衬里被压紧。断气后靠弹簧保持关闭，所以停电、断气会自动关阀（失气关 FC）。",
  opening: "<b>开阀中：</b>线圈通电、电磁阀换向，压缩空气进入执行器中间腔 → 两只活塞被推向两端并压缩弹簧 → 齿条带动齿轮轴转 90° → 蝶板转到与流向平行。",
  open: "<b>当前全开。</b>蝶板与流向平行，流道几乎无阻挡。此时弹簧被压到最短，储能最多——一旦断气或断电，阀门会立刻自行关闭。",
  closing: "<b>关阀中：</b>电磁阀断电，中间腔经消声器排气 → 弹簧把两只活塞推回中间 → 齿轮轴反向转 90° → 蝶板压住衬里，流道被封死。",
};
function caption(kind) {
  elChip.className = "chip " + (kind === "opening" || kind === "closing" ? "moving" : kind);
  elChip.textContent = kind === "open" ? "全开" : kind === "closed" ? "全关" : "动作中";
  elCap.innerHTML = CAP[kind];
}
function setStrokeTarget(to) {
  state.strokeTarget = to;
  elActT.textContent = to ? "关阀" : "开阀";
  if (reduce) {
    state.stroke = to;
    caption(to ? "open" : "closed");
    applyExplode();
    return;
  }
  caption(to ? "opening" : "closing");
}
document.getElementById("b-act").addEventListener("click", () => setStrokeTarget(state.strokeTarget === 0 ? 1 : 0));
caption("closed");

/* 主题色 → 高亮色 */
function readTheme() {
  const c = getComputedStyle(document.documentElement).getPropertyValue("--hl").trim();
  if (c) hlColor.set(c);
  state.shadowA = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--shadow-a")) || 0.22;
  paint();
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTheme);
new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ------------------------------------------------------------------ 主循环 */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;

  if (state.tTarget !== null) {
    const dir = Math.sign(state.tTarget - state.t);
    state.t += dir * dt * 0.55;
    if ((dir > 0 && state.t >= state.tTarget) || (dir < 0 && state.t <= state.tTarget) || dir === 0) {
      state.t = state.tTarget;
      state.tTarget = null;
    }
    syncSlider();
  }
  if (state.stroke !== state.strokeTarget) {
    const dir = Math.sign(state.strokeTarget - state.stroke);
    state.stroke += dir * dt * 1.15;
    if ((dir > 0 && state.stroke >= state.strokeTarget) || (dir < 0 && state.stroke <= state.strokeTarget)) {
      state.stroke = state.strokeTarget;
      caption(state.strokeTarget === 0 ? "closed" : "open");
    }
  }

  applyExplode();
  camPlace(false);
  controls.update();

  /* 包围盒跟随，地面与主光跟着模型走 */
  box.makeEmpty();
  for (const m of MESHES) box.expandByObject(m);
  ground.position.y = box.min.y - 1;
  ground.material.opacity = (state.shadowA || 0.22) * (1 - Math.min(1, state.t * 1.4));
  const c = box.getCenter(new V3());
  key.position.set(c.x + 240, c.y + 520, c.z + 300);
  key.target.position.copy(c);
  key.target.updateMatrixWorld();

  renderer.render(scene, camera);
  updateBalloons();
  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ 尺寸 */
function resize() {
  const w = canvas.clientWidth || 1;
  const h = canvas.clientHeight || 1;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  measureInsets();
  state.moved = false; // 尺寸/版式变化后重新取景，避免旋转过视角就被“锁死”
  refit();
}
new ResizeObserver(() => resize()).observe(canvas);

/* 启动：支持 #t=0.5&stroke=1&sel=3&bom=1&lbl=0 直接进入某个状态（截图/分享用） */
const qs = new URLSearchParams(location.hash.replace(/^#/, ""));
measureInsets();
readTheme();
if (qs.has("lbl")) state.labels = qs.get("lbl") === "1";
document.getElementById("app").classList.toggle("no-lbl", !state.labels);
document.getElementById("b-lbl").setAttribute("aria-pressed", String(state.labels));
refit();
if (qs.has("t")) {
  state.t = Math.min(1, Math.max(0, +qs.get("t")));
  state.tTarget = null;
} else {
  state.t = 0;
  state.tTarget = 1; // 开场：从装配状态推出来
}
if (qs.has("stroke")) {
  state.stroke = state.strokeTarget = Math.min(1, Math.max(0, +qs.get("stroke")));
  caption(state.stroke > 0.5 ? "open" : "closed");
}
if (qs.has("bom")) toggleBom(qs.get("bom") !== "0");
else if (window.innerWidth >= 960) toggleBom(true);
if (qs.has("sel")) {
  const p = PARTS.find((v) => v.no === +qs.get("sel"));
  if (p) select(p);
}
if (qs.has("cam")) {
  const v = qs.get("cam").split(",").map(Number);
  camera.position.set(v[0], v[1], v[2]);
  controls.target.set(v[3] || 0, v[4] || 0, v[5] || 0);
  state.moved = true;
}
if (qs.has("fov")) {
  camera.fov = +qs.get("fov");
  camera.updateProjectionMatrix();
}
if (qs.has("only")) {
  const keep = new Set(qs.get("only").split(",").map(Number));
  for (const p of PARTS) if (!keep.has(p.no)) for (const r of p.insts) r.g.visible = false;
}
syncSlider();
applyExplode();
camPlace(true);
box.makeEmpty();
for (const m of MESHES) box.expandByObject(m);
requestAnimationFrame(frame);

window.addEventListener("error", (e) => (document.documentElement.dataset.err = e.message));
setTimeout(() => {
  if (window.__diag) document.documentElement.dataset.diag = JSON.stringify(window.__diag());
}, 800);

/* 调试/截图用 */
window.__dbv = {
  state, PARTS, MESHES, camera, controls, refit,
  setExplode(v) { state.tTarget = null; state.t = v; syncSlider(); applyExplode(); camPlace(true); },
  setStroke(v) { state.strokeTarget = v; state.stroke = v; caption(v ? "open" : "closed"); applyExplode(); },
  select,
  toggleBom,
};
window.__diag = () => ({
  t: +state.t.toFixed(3), stroke: +state.stroke.toFixed(3),
  parts: PARTS.length, meshes: MESHES.length,
  balloons: document.querySelectorAll(".bln").length,
  cam: camera.position.toArray().map((v) => Math.round(v)),
  dist: Math.round(camera.position.distanceTo(controls.target)),
  fitB: fitB ? { d: Math.round(fitB.dist), min: fitB.box.min.toArray().map(Math.round), max: fitB.box.max.toArray().map(Math.round) } : null,
  inset: { ...inset }, aspect: +camera.aspect.toFixed(2), size: [canvas.clientWidth, canvas.clientHeight],
});


} catch (e) { document.documentElement.dataset.fatal = (e && e.stack) || String(e); console.error(e); }
})();</script>
</body>
</html>
